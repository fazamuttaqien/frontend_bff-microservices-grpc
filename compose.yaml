services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-frontend-bff-microservices-grpc}
        VITE_APP_ENVIRONMENT: ${VITE_APP_ENVIRONMENT:-development}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-http://localhost:8080}
        VITE_OBSERVABILITY_ENABLED: ${VITE_OBSERVABILITY_ENABLED:-false}
        VITE_FARO_URL: ${VITE_FARO_URL:-}
        VITE_FARO_APP_NAME: ${VITE_FARO_APP_NAME:-}
        VITE_FARO_APP_NAMESPACE: ${VITE_FARO_APP_NAMESPACE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
